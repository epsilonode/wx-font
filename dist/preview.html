<!doctype html><html><head><meta charset="utf-8"><title>wx-font preview</title><link rel="stylesheet" href="./wx-icons.css"><link rel="stylesheet" href="./wx-wmo.css"><style>body{font:16px system-ui;margin:2rem}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:1rem}.wx{font-size:2rem}article{border:1px solid #ddd;padding:.75rem}small{display:block}</style></head><body><h1>wx-font WMO preview</h1><main id="icons"></main><script type="module">import{resolveWmo}from'./wmo.js';const main=document.querySelector('#icons');for(let code=0;code<=99;code++){const value=String(code).padStart(2,'0');const result=resolveWmo(code,{isDay:true,cloudPercent:50});main.insertAdjacentHTML('beforeend','<article><i class="wx wx-wmo-'+value+' wx-day wx-okta-4"></i><small>'+value+'</small><small>'+result.className+'</small><small>'+String(result.cloudCategory??'')+'</small></article>')}</script></body></html>
